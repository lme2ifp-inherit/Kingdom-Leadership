<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Facilitator Tool — Leadership ID</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0a0f1a;color:#e8eef5;
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     font-size:16px;line-height:1.6;padding-bottom:60px}
.wrap{max-width:640px;margin:0 auto;padding:24px 18px}
.gold{color:#d4a520}
.muted{color:#8898a8}
h1{font-size:22px;font-weight:700;color:#f5e6c0;margin:0 0 4px}
.sub{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#d4a520;margin-bottom:22px}
input{width:100%;background:#111a28;border:1px solid #24344a;border-radius:8px;
      padding:13px 14px;color:#e8eef5;font-size:16px;font-family:inherit}
input:focus{outline:none;border-color:#d4a520}
select{width:100%;background:#111a28;border:1px solid #24344a;border-radius:8px;
       padding:13px 14px;color:#e8eef5;font-size:16px;font-family:inherit;
       -webkit-appearance:none;appearance:none;
       background-image:linear-gradient(45deg,transparent 50%,#8898a8 50%),
                        linear-gradient(135deg,#8898a8 50%,transparent 50%);
       background-position:calc(100% - 19px) 21px,calc(100% - 13px) 21px;
       background-size:6px 6px,6px 6px;background-repeat:no-repeat}
select:disabled{opacity:0.55}
select:focus{outline:none;border-color:#d4a520}
button{font-family:inherit;cursor:pointer}
.btn{background:#d4a520;color:#0a0f1a;border:none;border-radius:8px;
     padding:13px 28px;font-size:16px;font-weight:700;width:100%;margin-top:12px}
.err{color:#e07a5f;font-size:14px;margin-top:10px;min-height:20px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{flex:1;padding:11px 6px;border-radius:8px;font-size:13px;text-align:center;
     border:1px solid #24344a;background:#111a28;color:#8898a8;cursor:pointer}
.tab.on{border-color:#d4a520;color:#f5e6c0;background:#1a2436}
.tab.off{opacity:0.4;cursor:default}
.lbl{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:#8898a8;
     margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{background:#1a2436;border:1px solid #2e4058;border-radius:20px;
      padding:7px 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.chip b{font-weight:500}
.x{color:#8898a8;font-size:17px;line-height:1;padding:0 2px}
.sug{border:1px solid #24344a;border-top:none;border-radius:0 0 8px 8px;
     background:#111a28;max-height:230px;overflow-y:auto}
.sug div{padding:12px 14px;border-bottom:1px solid #1a2436;font-size:15px}
.sug div:last-child{border-bottom:none}
.sug .dom{font-size:11px;color:#8898a8;margin-left:8px}
.card{background:#111a28;border:1px solid #24344a;border-left-width:3px;
      border-radius:0 10px 10px 0;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 3px;font-size:17px;font-weight:600;color:#f5e6c0}
.pair{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#8898a8;margin-bottom:13px}
.row{display:flex;gap:10px;margin-bottom:7px;font-size:15px}
.k{flex:0 0 92px;font-size:12px;text-transform:uppercase;letter-spacing:0.06em;
   color:#8898a8;padding-top:3px}
.v{flex:1}
.lead{color:#f0e4cc;font-size:15.5px;line-height:1.6}
.ask{color:#d9c89a;font-size:15.5px;line-height:1.6;font-style:italic}
.todo{color:#6b7c8e;font-style:italic;line-height:1.55}
.count{font-size:12px;color:#8898a8;margin:18px 0 12px}
.signrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.signout{background:none;border:none;padding:0 0 0 4px;color:#d4a520;font-size:12px;
     text-decoration:underline;flex:0 0 auto;white-space:nowrap}
.hint{font-size:13px;color:#8898a8;margin-top:26px;padding-top:16px;border-top:1px solid #1a2436}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// The library lives here and nowhere else. Never written to storage —
// a refresh drops it and sign-in is required again. That is deliberate.
let LIB = null;   // Strengths x Gifts
let LIB2 = null;  // Personality x Gifts
let view = "login";
// Which library is on screen. The third pairing does not exist yet and its
// tab stays inert -- an enabled tab that renders nothing is worse than a
// visibly unfinished one.
let tab = "sg";
let email = "", pwd = "", loginErr = "", busy = false;

// Who signed in. Set by the server, never by the page. The page cannot
// promote itself to admin by editing a variable, because every privileged
// action is re-checked server-side against the facilitators table.
let ME = { role: null, campusId: null, displayName: "" };
// Gifts are shared across both tabs deliberately. The 19 gifts are the same
// 19 in both libraries -- verified by scripts/verify_personality_library.js,
// which fails if the two files ever disagree -- so making the facilitator
// enter them twice would be asking the same question twice.
let picked = { strengths: [], gifts: [], descriptors: [] };

const MAX = { strengths: 5, gifts: 3, descriptors: 5 };
const DOMAIN_COLORS = { Strategic:"#B8860B", Influencing:"#4A7C5E",
                        Relationship:"#6B5B8A", Executing:"#A0522D" };
const DOMAIN_LABELS = { Strategic:"Strategic Thinking", Influencing:"Influencing",
                        Relationship:"Relationship Building", Executing:"Executing" };

const esc = (s) => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

// One lookup for three item sets. Gifts come off library one; if library two
// ever ships without library one the gift words would vanish, so it falls
// through rather than throwing.
function bag(kind) {
  if (kind === "strengths")   return (LIB  && LIB.items.strengths)   || {};
  if (kind === "descriptors") return (LIB2 && LIB2.items.descriptors) || {};
  return (LIB && LIB.items.gifts) || (LIB2 && LIB2.items.gifts) || {};
}
function names(kind) { return Object.keys(bag(kind)); }
function item(kind, name) { return bag(kind)[name]; }

// Type-ahead: substring match anywhere, not just prefix. Typing "com" should
// surface both Command and Communication without knowing which comes first.
// Options for the dropdowns. Strengths are grouped by domain -- a flat wheel
// of 34 on a phone is a long spin, and the domain is already known. Gifts are
// only 19, so they stay one alphabetical list. Anything already picked is
// removed rather than disabled: an option you cannot choose is just clutter.
function options(kind) {
  const taken = picked[kind];
  const all = names(kind).filter(n => !taken.includes(n)).sort();
  if (kind === "gifts") {
    return all.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  }
  if (kind === "descriptors") {
    // 72 in one flat list is a long spin on a phone. Library one solves this
    // by grouping strengths into their four domains; descriptors have no
    // domain, so the initial letter is the only grouping available that a
    // facilitator can predict without being taught it.
    const groups = [];
    for (const n of all) {
      const letter = n[0].toUpperCase();
      const last = groups[groups.length - 1];
      if (last && last.letter === letter) last.items.push(n);
      else groups.push({ letter, items: [n] });
    }
    return groups.map(gr =>
      `<optgroup label="${esc(gr.letter)}">` +
      gr.items.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("") +
      `</optgroup>`).join("");
  }
  const order = ["Strategic", "Influencing", "Relationship", "Executing"];
  return order.map(d => {
    const inDomain = all.filter(n => item("strengths", n).domain === d);
    if (!inDomain.length) return "";
    return `<optgroup label="${esc(DOMAIN_LABELS[d])}">` +
      inDomain.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("") +
      `</optgroup>`;
  }).join("");
}

function render() {
  document.getElementById("app").innerHTML =
    view === "login" ? loginView() : toolView();
  wire();
}

function loginView() {
  return `
    <h1>Facilitator Tool</h1>
    <div class="sub">Leadership ID</div>
    <input id="email" type="email" placeholder="Email address"
           autocomplete="username" autocapitalize="off" autocorrect="off"
           inputmode="email" value="${esc(email)}">
    <input id="pwd" type="password" placeholder="Password"
           autocomplete="current-password" value="${esc(pwd)}"
           style="margin-top:10px">
    <button class="btn" id="go">${busy ? "Signing in…" : "Sign in"}</button>
    <div class="err">${esc(loginErr)}</div>
    <div class="hint">This tool is for facilitators. Participants should use
      the main app.<br><br><a href="/reset.html" style="color:#d4a520">Forgot your
      password?</a></div>`;
}

const NOUN = { strengths: "strength", gifts: "gift", descriptors: "descriptor" };

function picker(kind, label) {
  const sel = picked[kind];
  const full = sel.length >= MAX[kind];
  return `
    <div class="lbl"><span>${label}</span><span>${sel.length} / ${MAX[kind]}</span></div>
    <select id="q-${kind}" ${full ? "disabled" : ""}>
      <option value="">${full ? "Remove one to add another"
                              : "Choose a " + NOUN[kind] + "\u2026"}</option>
      ${full ? "" : options(kind)}
    </select>
    ${sel.length ? `<div class="chips">${sel.map(n =>
      `<span class="chip"><b>${esc(n)}</b><span class="x" data-del="${kind}"
        data-name="${esc(n)}">&times;</span></span>`).join("")}</div>` : ""}`;
}

function cell(s, g) {
  const S = item("strengths", s), G = item("gifts", g);
  const b = LIB.blends[s + "|" + g] || null;
  const seeds = esc(S.essence) + " + " + esc(G.essence);
  return `
    <div class="card" style="border-left-color:${DOMAIN_COLORS[S.domain]}">
      <h3>${esc(s)} &times; ${esc(g)}</h3>
      <div class="pair">Strengths &times; Gifts</div>
      <div class="row"><div class="k">Blend seeds</div>
        <div class="v">${seeds}</div></div>
      ${b ? `
      <div class="row"><div class="k">Looks like</div>
        <div class="v lead">${esc(b.recognize)}</div></div>
      <div class="row"><div class="k">Ask them</div>
        <div class="v ask">${esc(b.ask)}</div></div>`
      : `
      <div class="row"><div class="k">Looks like</div>
        <div class="v todo">Start with the two seed words above and let them
          find their own name for it.</div></div>`}
      <div class="row"><div class="k">In action</div>
        <div class="v">${esc(S.action)} + ${esc(G.action)}</div></div>
      <div class="row"><div class="k">Watch for</div>
        <div class="v">${esc(S.shadow)} + ${esc(G.shadow)}</div></div>
    </div>`;
}

// Library two's card. Same shape as above so a facilitator holding one card
// next to the other is reading the same five lines in the same order. The
// only structural difference is the accent colour: descriptors have no
// domain, so there is nothing to colour-code and the gold is used flat.
function cell2(d, g) {
  const D = item("descriptors", d), G = item("gifts", g);
  const b = LIB2.blends[d + "|" + g] || null;
  const seeds = esc(D.essence) + " + " + esc(G.essence);
  return `
    <div class="card" style="border-left-color:#d4a520">
      <h3>${esc(d)} &times; ${esc(g)}</h3>
      <div class="pair">Personality &times; Gifts</div>
      <div class="row"><div class="k">Blend seeds</div>
        <div class="v">${seeds}</div></div>
      ${b ? `
      <div class="row"><div class="k">Looks like</div>
        <div class="v lead">${esc(b.recognize)}</div></div>
      <div class="row"><div class="k">Ask them</div>
        <div class="v ask">${esc(b.ask)}</div></div>`
      : `
      <div class="row"><div class="k">Looks like</div>
        <div class="v todo">Start with the two seed words above and let them
          find their own name for it.</div></div>`}
      <div class="row"><div class="k">In action</div>
        <div class="v">${esc(D.action)} + ${esc(G.action)}</div></div>
      <div class="row"><div class="k">Watch for</div>
        <div class="v">${esc(D.shadow)} + ${esc(G.shadow)}</div></div>
    </div>`;
}

// The deployed library, counted in the page from the data the server actually
// sent. This is the only number in the whole project that is read off the live
// deployment rather than off a copy of a file, which makes it the check to
// trust when a count is in doubt. If content is ever silently dropped, this
// number falls and you can see it without running anything.
function libraryWritten() {
  const L = tab === "pg" ? LIB2 : LIB;
  return L && L.blends ? Object.keys(L.blends).length : 0;
}
function libraryTotal() {
  const L = tab === "pg" ? LIB2 : LIB;
  if (!L || !L.items) return 0;
  const rows = tab === "pg" ? L.items.descriptors : L.items.strengths;
  return Object.keys(rows).length * Object.keys(L.items.gifts).length;
}

function toolView() {
  const pg = tab === "pg";
  const rowKind = pg ? "descriptors" : "strengths";
  const R = picked[rowKind], G = picked.gifts;
  const store = pg ? LIB2.blends : LIB.blends;
  const cells = [];
  for (const r of R) for (const g of G) cells.push(pg ? cell2(r, g) : cell(r, g));
  const written = R.reduce((n, r) =>
    n + G.filter(g => store[r + "|" + g]).length, 0);

  return `
    <h1>Facilitator Tool</h1>
    <div class="sub">Leadership ID</div>
    <div class="count signrow" style="margin-top:-14px"><span>Signed in as ${esc(ME.displayName)}
      &middot; ${ME.role === "admin" ? "Admin &middot; all campuses"
        : "Facilitator" + (ME.campusId ? " &middot; " + esc(ME.campusId) : "")}</span><button
      class="signout" id="signout" type="button">Sign out</button></div>
    <div class="count" style="margin-top:-6px">Library: ${libraryWritten()} of ${libraryTotal()} cells written</div>
    <div class="tabs">
      <div class="tab ${pg ? "" : "on"}" data-tab="sg">Strengths &times; Gifts</div>
      <div class="tab ${pg ? "on" : ""} ${LIB2 ? "" : "off"}"
        ${LIB2 ? 'data-tab="pg"' : ""}>Personality &times; Gifts</div>
      <div class="tab off">Strengths &times; Personality</div>
    </div>
    ${pg ? picker("descriptors", "Personality descriptors")
         : picker("strengths", "Strengths")}
    ${picker("gifts", "Gifts")}
    ${cells.length ? `<div class="count">${cells.length} pairing${
        cells.length === 1 ? "" : "s"} &middot; ${written} written</div>${cells.join("")}`
      : `<div class="hint">Enter their ${pg ? "descriptors" : "strengths"} and
          gifts above to see the pairings.</div>`}
    <div class="hint">Never read a card aloud. Lead with the two seed words. The
      other lines are there for when someone gets stuck.</div>`;
}

function wire() {
  const pwdEl = document.getElementById("pwd");
  if (pwdEl) {
    const emailEl = document.getElementById("email");
    emailEl.oninput = e => { email = e.target.value; };
    emailEl.onkeydown = e => { if (e.key === "Enter") document.getElementById("pwd").focus(); };
    pwdEl.oninput = e => { pwd = e.target.value; };
    pwdEl.onkeydown = e => { if (e.key === "Enter") login(); };
    document.getElementById("go").onclick = login;
    return;
  }
  const so = document.getElementById("signout");
  if (so) so.onclick = signOut;
  document.querySelectorAll("[data-tab]").forEach(el => {
    el.onclick = () => {
      if (el.dataset.tab === tab) return;
      // Selections survive the switch. Gifts are shared, and coming back to a
      // tab to find the strengths gone would punish a facilitator for looking
      // at the other card mid-conversation.
      tab = el.dataset.tab;
      render();
    };
  });
  for (const kind of ["strengths", "gifts", "descriptors"]) {
    const q = document.getElementById("q-" + kind);
    if (!q) continue;
    q.onchange = e => {
      const name = e.target.value;
      if (!name) return;
      // Guard the cap here as well as in the markup. The select is disabled at
      // the limit, but a disabled control is a UI state, not a rule.
      if (picked[kind].length < MAX[kind] && !picked[kind].includes(name)) {
        picked[kind].push(name);
      }
      render();
    };
  }
  document.querySelectorAll("[data-del]").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.del;
      picked[k] = picked[k].filter(n => n !== el.dataset.name);
      render();
    };
  });
}

// Sign out clears everything, not just the view. The library must go, or a
// refresh-less "logout" would leave every answer sitting in memory one
// variable away from being re-rendered. The participant's selections go too:
// they are somebody else's results, and the next person to hold this phone
// should not see who was just being coached. Nothing here is stored, so
// nothing needs deleting anywhere else.
function signOut() {
  LIB = null;
  LIB2 = null;
  ME = { role: null, campusId: null, displayName: "" };
  picked = { strengths: [], gifts: [], descriptors: [] };
  tab = "sg";
  email = ""; pwd = ""; loginErr = ""; busy = false;
  view = "login";
  render();
}

async function login() {
  if (busy || !email.trim() || !pwd) return;
  busy = true; loginErr = ""; render();
  try {
    const r = await fetch("/api/library", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email.trim(), password: pwd }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) {
      loginErr = d.error || ("Failed (" + r.status + ")");
      busy = false; pwd = ""; render(); return;
    }
    LIB = { items: d.items, blends: d.blends };
    // Library two is tolerated as absent. If an older deployment of
    // api/library.js is live, the second tab simply stays unavailable rather
    // than the whole page failing to render.
    LIB2 = (d.items2 && d.blends2) ? { items: d.items2, blends: d.blends2 } : null;
    if (!LIB2) tab = "sg";
    ME = { role: d.role, campusId: d.campusId, displayName: d.displayName || "" };
    // The password never stays in memory past the request that used it.
    pwd = ""; busy = false; view = "tool"; render();
  } catch (e) {
    loginErr = "Network error. Check your connection.";
    busy = false; render();
  }
}

render();
</script>
</body>
</html>
