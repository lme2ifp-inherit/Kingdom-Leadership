<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Reset Password — Leadership ID</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0a0f1a;color:#e8eef5;
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     font-size:16px;line-height:1.6;padding-bottom:60px}
.wrap{max-width:640px;margin:0 auto;padding:24px 18px}
h1{font-size:22px;font-weight:700;color:#f5e6c0;margin:0 0 4px}
.sub{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#d4a520;margin-bottom:22px}
p.intro{color:#8898a8;font-size:14.5px;margin:0 0 18px}
input{width:100%;background:#111a28;border:1px solid #24344a;border-radius:8px;
      padding:13px 14px;color:#e8eef5;font-size:16px;font-family:inherit}
input:focus{outline:none;border-color:#d4a520}
input:disabled{opacity:0.55}
button{font-family:inherit;cursor:pointer}
.btn{background:#d4a520;color:#0a0f1a;border:none;border-radius:8px;
     padding:13px 28px;font-size:16px;font-weight:700;width:100%;margin-top:12px}
.btn:disabled{opacity:0.6}
.err{color:#e07a5f;font-size:14px;margin-top:10px;min-height:20px}
.good{color:#7fb069;font-size:15px;margin-top:14px;line-height:1.6}
.rule{font-size:12.5px;color:#6b7c8e;margin-top:8px}
.hint{font-size:13px;color:#8898a8;margin-top:26px;padding-top:16px;border-top:1px solid #1a2436}
a{color:#d4a520}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ===========================================================================
// PASSWORD RESET PAGE -- reset.html
//
// One page, two states, decided by whether the URL carries a recovery token:
//
//   no token  -> REQUEST. Enter an email, we send a link.
//   token     -> SET. Enter a new password twice.
//
// No Supabase library, no Supabase key, no key of any kind. Everything goes
// through /api/reset-request and /api/reset-confirm, exactly like sign-in
// goes through /api/library. If a key were needed here, view-source would
// hand it to anyone.
// ===========================================================================

var MIN_PASSWORD = 8;

var state  = "request";   // "request" | "set" | "sent" | "done"
var token  = null;        // { kind: "token_hash" | "access_token", value: "..." }
var email = "", pw1 = "", pw2 = "";
var err = "", busy = false;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// -- Find the token, whichever shape the email template used ----------------
//
// Supabase sends either ?token_hash=... in the query or #access_token=... in
// the fragment, depending on the template. Both are read here so the page
// works either way rather than failing in a way that looks like a code bug
// when it is really a dashboard setting.
function readToken() {
  var q = new URLSearchParams(window.location.search);
  var h = new URLSearchParams((window.location.hash || "").replace(/^#/, ""));

  // An expired link comes back as an error in the fragment, with no token.
  // Saying so beats showing an empty form that cannot work.
  var errDesc = h.get("error_description") || q.get("error_description");

  var th = q.get("token_hash") || h.get("token_hash");
  var at = h.get("access_token") || q.get("access_token");

  if (th)      token = { kind: "token_hash",   value: th };
  else if (at) token = { kind: "access_token", value: at };

  if (token) {
    state = "set";
    // Strip the token out of the address bar immediately. It is single-use,
    // but a recovery token sitting in a URL is one screenshot or one shared
    // link away from being somebody else's.
    try {
      window.history.replaceState({}, document.title, window.location.pathname);
    } catch (e) { /* not fatal */ }
  } else if (errDesc) {
    state = "request";
    err = "That reset link has expired or has already been used. "
        + "Enter your email below and we will send a new one.";
  }
}

function requestView() {
  return '<h1>Reset Password</h1>'
    + '<div class="sub">Leadership ID</div>'
    + '<p class="intro">Enter the email address for your facilitator account. '
    + 'If it has an account, we will send you a link to set a new password.</p>'
    + '<input id="email" type="email" placeholder="Email address" '
    +   'autocomplete="username" autocapitalize="off" autocorrect="off" '
    +   'inputmode="email" value="' + esc(email) + '"' + (busy ? " disabled" : "") + '>'
    + '<button class="btn" id="go"' + (busy ? " disabled" : "") + '>'
    +   (busy ? "Sending\u2026" : "Send reset link") + '</button>'
    + '<div class="err">' + esc(err) + '</div>'
    + '<div class="hint">Remembered it? <a href="/facilitator.html">Back to sign in</a>.'
    + '<br><br>The link is good for one use and expires after a short time. '
    + 'If nothing arrives within a few minutes, check spam, then try again.</div>';
}

function sentView() {
  return '<h1>Check Your Email</h1>'
    + '<div class="sub">Leadership ID</div>'
    + '<div class="good">' + esc(err) + '</div>'
    + '<div class="hint">The link is good for one use and expires after a short '
    + 'time. If nothing arrives within a few minutes, check your spam folder, '
    + 'then <a href="/reset.html">try again</a>.'
    + '<br><br><a href="/facilitator.html">Back to sign in</a>.</div>';
}

function setView() {
  return '<h1>Set a New Password</h1>'
    + '<div class="sub">Leadership ID</div>'
    + '<p class="intro">Choose a new password for your facilitator account.</p>'
    + '<input id="pw1" type="password" placeholder="New password" '
    +   'autocomplete="new-password"' + (busy ? " disabled" : "") + '>'
    + '<div class="rule">At least ' + MIN_PASSWORD + ' characters.</div>'
    + '<input id="pw2" type="password" placeholder="Type it again" '
    +   'autocomplete="new-password" style="margin-top:10px"'
    +   (busy ? " disabled" : "") + '>'
    + '<button class="btn" id="save"' + (busy ? " disabled" : "") + '>'
    +   (busy ? "Saving\u2026" : "Save new password") + '</button>'
    + '<div class="err">' + esc(err) + '</div>'
    + '<div class="hint">This link works once. If you leave this page before '
    + 'saving, request a new link from the sign-in screen.</div>';
}

function doneView() {
  return '<h1>Password Updated</h1>'
    + '<div class="sub">Leadership ID</div>'
    + '<div class="good">Your password has been changed. '
    + 'You can sign in with it now.</div>'
    + '<button class="btn" id="tosignin">Go to sign in</button>';
}

function render() {
  var html;
  if (state === "sent")      html = sentView();
  else if (state === "set")  html = setView();
  else if (state === "done") html = doneView();
  else                       html = requestView();

  document.getElementById("app").innerHTML = html;
  wire();
}

function wire() {
  var e = document.getElementById("email");
  if (e) {
    e.oninput = function (ev) { email = ev.target.value; };
    e.onkeydown = function (ev) { if (ev.key === "Enter") sendRequest(); };
    if (!busy) e.focus();
  }
  var go = document.getElementById("go");
  if (go) go.onclick = sendRequest;

  var a = document.getElementById("pw1");
  if (a) {
    a.oninput = function (ev) { pw1 = ev.target.value; };
    a.onkeydown = function (ev) {
      if (ev.key === "Enter") document.getElementById("pw2").focus();
    };
    if (!busy) a.focus();
  }
  var b = document.getElementById("pw2");
  if (b) {
    b.oninput = function (ev) { pw2 = ev.target.value; };
    b.onkeydown = function (ev) { if (ev.key === "Enter") savePassword(); };
  }
  var s = document.getElementById("save");
  if (s) s.onclick = savePassword;

  var t = document.getElementById("tosignin");
  if (t) t.onclick = function () { window.location.href = "/facilitator.html"; };
}

// Values that come back from the server are shown to the user, so they are
// checked for shape before use. A response that is not what we expect gets a
// message of our own rather than whatever arrived.
function messageFrom(data, fallback) {
  if (data && typeof data.error === "string" && data.error) return data.error;
  if (data && typeof data.message === "string" && data.message) return data.message;
  return fallback;
}

async function sendRequest() {
  if (busy) return;
  if (!email.trim()) { err = "Enter your email address."; render(); return; }

  busy = true; err = ""; render();
  try {
    var r = await fetch("/api/reset-request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email.trim() }),
    });
    var d = await r.json().catch(function () { return null; });

    if (r.ok && d && d.ok === true) {
      err = messageFrom(d, "If that address has an account, a reset link is on its way.");
      state = "sent";
      busy = false;
      render();
      return;
    }
    err = messageFrom(d, "Something went wrong (" + r.status + "). Please try again.");
  } catch (e) {
    err = "Could not reach the server. Check your connection and try again.";
  }
  busy = false;
  render();
}

async function savePassword() {
  if (busy) return;

  // Checked here for a fast answer, and again on the server, which is the
  // one that counts.
  if (pw1.length < MIN_PASSWORD) {
    err = "Password must be at least " + MIN_PASSWORD + " characters.";
    render(); return;
  }
  if (pw1 !== pw2) {
    err = "The two passwords do not match.";
    render(); return;
  }
  if (!token) {
    err = "This reset link is no longer valid. Please request a new one.";
    render(); return;
  }

  busy = true; err = ""; render();

  var payload = { password: pw1 };
  payload[token.kind] = token.value;

  try {
    var r = await fetch("/api/reset-confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    var d = await r.json().catch(function () { return null; });

    if (r.ok && d && d.ok === true) {
      // Drop the password and the token the moment they are spent. Neither
      // has any further use and both are worth not keeping around.
      pw1 = ""; pw2 = ""; token = null;
      state = "done"; busy = false; err = "";
      render();
      return;
    }
    err = messageFrom(d, "Something went wrong (" + r.status + "). Please try again.");
  } catch (e) {
    err = "Could not reach the server. Check your connection and try again.";
  }
  busy = false;
  render();
}

readToken();
render();
</script>
</body>
</html>
